# ============================================================
# 日志存储配置（Spring Boot 3.x 标准规范）
# ============================================================
# 指定日志文件存放路径及文件名（相对路径，默认生成在项目根目录 logs/ 文件夹下）
logging.file.name=logs/aiagentdemo.log
# 日志文件滚动切割策略：单个文件最大 10MB，历史日志最多保留 7 天
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

